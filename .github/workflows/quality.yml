name: Code quality

on:
  push:
    branches: [main, develop, 'release/**']
  pull_request:
  workflow_dispatch:

# These checks are intentionally not required by the initial ruleset policy.
# Failures stay visible; there is no continue-on-error or coverage threshold.
permissions:
  contents: read

jobs:
  host-instrumented:
    name: Host sanitizers and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++-13 lcov
          g++-13 --version
          lcov --version
      - name: Configure host instrumentation
        id: configure
        run: >-
          cmake -S tests -B build-quality -G Ninja
          -DCMAKE_CXX_COMPILER=g++-13 -DCMAKE_BUILD_TYPE=Debug
          -DPICOTTL_ENABLE_SANITIZERS=ON -DPICOTTL_ENABLE_COVERAGE=ON
      - name: Build instrumented tests
        id: build
        run: cmake --build build-quality --parallel 2
      - name: Run instrumented host suite
        id: tests
        run: ctest --test-dir build-quality --output-on-failure --verbose
      - name: Collect host coverage
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        run: |
          mkdir -p reports/coverage
          lcov --capture --directory build-quality --gcov-tool gcov-13 --output-file reports/coverage/raw.info
          python3 tools/quality.py coverage --input reports/coverage/raw.info --output-dir reports/coverage
          genhtml reports/coverage/lcov.info --output-directory reports/coverage/html --legend
      - name: Publish coverage summary
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          if [ -f reports/coverage/summary.md ]; then
            cat reports/coverage/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo '### Host coverage' >> "$GITHUB_STEP_SUMMARY"
            echo 'Coverage unavailable: tests or collection failed. Inspect the failed step; no percentage is claimed.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload coverage and test logs
        if: ${{ !cancelled() && steps.configure.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: host-sanitizers-coverage
          path: |
            reports/coverage/
            build-quality/Testing/Temporary/
          if-no-files-found: warn
          retention-days: 14

  static-analysis:
    name: Host static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install static analyzers
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++-13 clang-tidy-18 cppcheck
          clang-tidy-18 --version
          cppcheck --version
      - name: Configure host compilation database
        id: configure
        run: cmake -S tests -B build-static -G Ninja -DCMAKE_CXX_COMPILER=g++-13 -DCMAKE_BUILD_TYPE=Debug
      - name: Check report scope and classification
        run: python3 -m unittest discover -s tools/quality_tests -v
      - name: Run clang-tidy
        if: ${{ !cancelled() && steps.configure.outcome == 'success' }}
        run: python3 tools/quality.py static clang-tidy --executable clang-tidy-18 --build-dir build-static --output-dir reports/clang-tidy
      - name: Run cppcheck
        if: ${{ !cancelled() && steps.configure.outcome == 'success' }}
        run: python3 tools/quality.py static cppcheck --build-dir build-static --output-dir reports/cppcheck
      - name: Publish static analysis summary
        if: ${{ !cancelled() && steps.configure.outcome == 'success' }}
        run: |
          for report in reports/clang-tidy/summary.md reports/cppcheck/summary.md; do
            if [ -f "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi
          done
      - name: Upload static analysis reports
        if: ${{ !cancelled() && steps.configure.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: host-static-analysis
          path: |
            reports/clang-tidy/
            reports/cppcheck/
          if-no-files-found: warn
          retention-days: 14
